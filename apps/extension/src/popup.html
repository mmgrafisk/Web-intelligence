<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Bookmark Intelligence Quick Save</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Inter, Arial, sans-serif;
      }
      body {
        box-sizing: border-box;
        width: 330px;
        margin: 0;
        padding: 20px;
        color: #202126;
        background: #f8f7f3;
      }
      .brand {
        margin: 0 0 18px;
        color: #6d58d9;
        font-size: 12px;
        font-weight: 800;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }
      h1 {
        margin: 0 0 5px;
        overflow: hidden;
        font-size: 17px;
        line-height: 1.3;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .url {
        margin: 0 0 18px;
        overflow: hidden;
        color: #777782;
        font-size: 11px;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      label {
        display: grid;
        gap: 7px;
        margin-bottom: 13px;
        color: #55545d;
        font-size: 12px;
        font-weight: 700;
      }
      select,
      button {
        box-sizing: border-box;
        width: 100%;
        border-radius: 9px;
        font: inherit;
      }
      select {
        padding: 10px;
        border: 1px solid #d9d7cf;
        background: white;
      }
      button {
        padding: 11px;
        border: 0;
        cursor: pointer;
        font-weight: 800;
      }
      #save {
        background: #6d58d9;
        color: white;
      }
      #save:disabled {
        cursor: wait;
        opacity: 0.65;
      }
      #options {
        margin-top: 7px;
        background: transparent;
        color: #62616a;
        font-size: 11px;
      }
      .status {
        min-height: 16px;
        margin: 11px 0 0;
        color: #62616a;
        font-size: 11px;
      }
      .status.success {
        color: #315d50;
      }
      .status.error {
        color: #8f3832;
      }
    </style>
    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, ui-sans-serif, Arial, sans-serif;
      }
      body {
        width: 360px;
        padding: 22px;
        color: #f3f4f6;
        background: #111214;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 9px;
        margin: 0 0 22px;
        color: #f3f4f6;
        font-size: 12px;
        letter-spacing: 0;
        text-transform: none;
      }
      .brand::before {
        content: "B";
        display: grid;
        width: 28px;
        height: 28px;
        place-items: center;
        border-radius: 8px 8px 8px 2px;
        background: #4f7cff;
        color: white;
        font-size: 15px;
        font-weight: 800;
        box-shadow: 0 6px 16px rgba(79, 124, 255, 0.24);
      }
      h1 {
        margin-bottom: 6px;
        color: #f8f9fb;
        font-size: 18px;
        font-weight: 700;
      }
      .url {
        margin-bottom: 20px;
        color: #7e8795;
      }
      label {
        color: #a2a9b5;
      }
      select {
        border-color: #3a404a;
        background: #1b1d20;
        color: #f3f4f6;
      }
      button {
        border-radius: 9px;
      }
      #save {
        background: #4f7cff;
      }
      #save:hover:not(:disabled) {
        background: #3c66d9;
      }
      #options {
        color: #a2a9b5;
      }
      #options:hover {
        color: #f3f4f6;
      }
      .status {
        color: #a2a9b5;
      }
      .status.success {
        color: #9fe0c7;
      }
      .status.error {
        color: #ffb3b3;
      }
    </style>
  </head>
  <body>
    <p class="brand">Bookmark Intelligence</p>
    <h1 id="page-title">Current page</h1>
    <p class="url" id="page-url"></p>
    <label>
      Save to
      <select id="destination"></select>
    </label>
    <button id="save" type="button">Send to library</button>
    <p class="status" id="status" aria-live="polite"></p>
    <button id="options" type="button">Library settings</button>
    <script src="popup.js" type="module"></script>
  </body>
</html>
